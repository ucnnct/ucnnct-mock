services:
  mock-control-center:
    image: node:22-bookworm
    working_dir: /workspace/mock-control-center
    command: >
      sh -c "npm install &&
      npm start -- --host 0.0.0.0 --port 4200 --poll 2000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4200:4200"
    volumes:
      - ./mock-control-center:/workspace/mock-control-center
      - mock-control-center-node-modules:/workspace/mock-control-center/node_modules

volumes:
  mock-control-center-node-modules:
