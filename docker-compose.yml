services:
  orchestrator:
    image: node:22-bookworm
    working_dir: /workspace/orchestrator
    command: >
      sh -c "npm install &&
      npm start"
    environment:
      PORT: "7300"
    ports:
      - "7300:7300"
    volumes:
      - ./orchestrator:/workspace/orchestrator
      - orchestrator-node-modules:/workspace/orchestrator/node_modules

  mock-control-center:
    image: node:22-bookworm
    working_dir: /workspace/mock-control-center
    command: >
      sh -c "npm install &&
      npm start -- --host 0.0.0.0 --port 4200 --poll 2000"
    depends_on:
      - orchestrator
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4200:4200"
    volumes:
      - ./mock-control-center:/workspace/mock-control-center
      - mock-control-center-node-modules:/workspace/mock-control-center/node_modules

  worker-service:
    image: node:22-bookworm
    working_dir: /workspace/worker-service
    command: >
      sh -c "npm install &&
      npm start"
    environment:
      PORT: "7400"
    ports:
      - "7400:7400"
    volumes:
      - ./worker-service:/workspace/worker-service
      - worker-service-node-modules:/workspace/worker-service/node_modules

  mock-user-service:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace/mock-user-service
    command: >
      sh -c "mvn -q spring-boot:run"
    environment:
      SERVER_PORT: "7500"
    ports:
      - "7500:7500"
    volumes:
      - ./mock-user-service:/workspace/mock-user-service
      - mock-user-service-m2:/root/.m2

volumes:
  orchestrator-node-modules:
  mock-control-center-node-modules:
  worker-service-node-modules:
  mock-user-service-m2:
