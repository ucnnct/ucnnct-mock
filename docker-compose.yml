services:
  orchestrator:
    image: node:22-bookworm
    working_dir: /workspace/orchestrator
    command: >
      sh -c "npm install &&
      npm start"
    environment:
      PORT: "7300"
      WORKER_SERVICE_ORIGIN: "http://worker-service:7400"
      MOCK_USER_SERVICE_ORIGIN: "http://mock-user-service:7500"
      WORKER_SHARD_SIZE: "200"
      WORKER_MIN_REPLICAS: "2"
      WORKER_MAX_REPLICAS: "50"
      MAX_VIRTUAL_USERS: "10000"
    depends_on:
      - worker-service
      - mock-user-service
    ports:
      - "7300:7300"
    volumes:
      - ./orchestrator:/workspace/orchestrator
      - orchestrator-node-modules:/workspace/orchestrator/node_modules

  mock-control-center:
    image: node:22-bookworm
    working_dir: /workspace/mock-control-center
    command: >
      sh -c "npm install &&
      npm start -- --host 0.0.0.0 --port 4200 --poll 2000"
    depends_on:
      - orchestrator
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4200:4200"
    volumes:
      - ./mock-control-center:/workspace/mock-control-center
      - mock-control-center-node-modules:/workspace/mock-control-center/node_modules

  worker-service:
    image: node:22-bookworm
    working_dir: /workspace/worker-service
    command: >
      sh -c "npm install &&
      npm start"
    environment:
      PORT: "7400"
      STAGING_IDENTITY_BASE_URL: "https://auth-staging.uconnect.cc"
      STAGING_IDENTITY_TRANSPORT_URL: "http://172.31.255.240"
      STAGING_IDENTITY_HOST_HEADER: "auth-staging.uconnect.cc"
      STAGING_IDENTITY_REALM: "ucnnct"
      STAGING_IDENTITY_CLIENT_ID: "ucnnct-bff"
      STAGING_IDENTITY_CLIENT_SECRET: "MfkAe9Nk7tM1HhqWsCD4A5SuC9ItTDTH"
    ports:
      - "7400:7400"
    volumes:
      - ./worker-service:/workspace/worker-service
      - worker-service-node-modules:/workspace/worker-service/node_modules

  mock-user-service:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace/mock-user-service
    command: >
      sh -c "mvn -q spring-boot:run"
    environment:
      SERVER_PORT: "7500"
      STAGING_IDENTITY_PROVISION_ENABLED: "true"
      STAGING_IDENTITY_BASE_URL: "https://auth-staging.uconnect.cc"
      STAGING_IDENTITY_TRANSPORT_URL: "http://172.31.255.240"
      STAGING_IDENTITY_HOST_HEADER: "auth-staging.uconnect.cc"
      STAGING_IDENTITY_REALM: "ucnnct"
      STAGING_IDENTITY_ADMIN_CLIENT_ID: "admin-cli"
      STAGING_IDENTITY_ADMIN_USERNAME: "admin"
      STAGING_IDENTITY_ADMIN_PASSWORD: "admin"
      STAGING_IDENTITY_CLIENT_ID: "ucnnct-bff"
      STAGING_IDENTITY_CLIENT_SECRET: "MfkAe9Nk7tM1HhqWsCD4A5SuC9ItTDTH"
      STAGING_IDENTITY_TARGET_BASE_URL: "https://staging.uconnect.cc"
      STAGING_IDENTITY_USERNAME_PREFIX: "mock.staging"
      STAGING_IDENTITY_DEFAULT_PASSWORD: "MockPass123!"
      MOCK_USERS_TARGET_COUNT: "10000"
      MOCK_USERS_PROVISION_CONCURRENCY: "32"
      MOCK_USERS_PROVISION_BATCH_SIZE: "100"
      MOCK_USERS_WARMUP_STEP: "1000"
    ports:
      - "7500:7500"
    volumes:
      - ./mock-user-service:/workspace/mock-user-service
      - mock-user-service-m2:/root/.m2

volumes:
  orchestrator-node-modules:
  mock-control-center-node-modules:
  worker-service-node-modules:
  mock-user-service-m2:
