name: Build and Push Mock Images

on:
  push:
    branches: ["main"]
    paths:
      - "mock-control-center/**"
      - "orchestrator/**"
      - "worker-service/**"
      - "mock-user-service/**"
      - ".github/workflows/deploy-main.yml"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  detect-changes:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      worker: ${{ steps.filter.outputs.worker }}
      mockuser: ${{ steps.filter.outputs.mockuser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend: ["mock-control-center/**", ".github/workflows/deploy-main.yml"]
            orchestrator: ["orchestrator/**", ".github/workflows/deploy-main.yml"]
            worker: ["worker-service/**", ".github/workflows/deploy-main.yml"]
            mockuser: ["mock-user-service/**", ".github/workflows/deploy-main.yml"]

  tests:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.orchestrator == 'true' || needs.detect-changes.outputs.worker == 'true'
        with:
          node-version: "22"

      - name: Frontend build
        if: needs.detect-changes.outputs.frontend == 'true'
        working-directory: mock-control-center
        run: |
          npm ci
          npm run build

      - name: Orchestrator typecheck
        if: needs.detect-changes.outputs.orchestrator == 'true'
        working-directory: orchestrator
        run: |
          npm ci
          npm run check

      - name: Worker-service typecheck
        if: needs.detect-changes.outputs.worker == 'true'
        working-directory: worker-service
        run: |
          npm ci
          npm run check

      - uses: actions/setup-java@v4
        if: needs.detect-changes.outputs.mockuser == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Mock-user-service tests
        if: needs.detect-changes.outputs.mockuser == 'true'
        working-directory: mock-user-service
        run: mvn -q test

  build-push:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    needs: [detect-changes, tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          MSG_LC="$(echo "${{ github.event.head_commit.message }}" | tr '[:upper:]' '[:lower:]')"
          BUMP="patch"
          if [[ "$MSG_LC" =~ (feat|feature) ]]; then
            BUMP="minor"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump changed service versions
        shell: bash
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.bump }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          ORCHESTRATOR_CHANGED: ${{ needs.detect-changes.outputs.orchestrator }}
          WORKER_CHANGED: ${{ needs.detect-changes.outputs.worker }}
          MOCKUSER_CHANGED: ${{ needs.detect-changes.outputs.mockuser }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          bump = os.environ["BUMP_TYPE"]

          def bump_version(value: str) -> str:
            major, minor, patch = [int(part) for part in value.strip().lstrip("v").split(".")]
            if bump == "minor":
              minor += 1
              patch = 0
            else:
              patch += 1
            return f"{major}.{minor}.{patch}"

          def bump_package_json(path: str) -> None:
            file = Path(path)
            data = json.loads(file.read_text(encoding="utf-8"))
            data["version"] = bump_version(data["version"])
            file.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          def bump_pom(path: str) -> None:
            file = Path(path)
            text = file.read_text(encoding="utf-8")
            parent = re.search(r"<parent>.*?</parent>", text, flags=re.S)
            start = parent.end() if parent else 0
            match = re.search(r"<version>\s*([^<]+)\s*</version>", text[start:])
            if match is None:
              raise RuntimeError(f"Missing version in {path}")
            old_version = match.group(1)
            new_version = bump_version(old_version)
            absolute_start = start + match.start(1)
            absolute_end = start + match.end(1)
            file.write_text(text[:absolute_start] + new_version + text[absolute_end:], encoding="utf-8")

          if os.environ["FRONTEND_CHANGED"] == "true":
            bump_package_json("mock-control-center/package.json")
          if os.environ["ORCHESTRATOR_CHANGED"] == "true":
            bump_package_json("orchestrator/package.json")
          if os.environ["WORKER_CHANGED"] == "true":
            bump_package_json("worker-service/package.json")
          if os.environ["MOCKUSER_CHANGED"] == "true":
            bump_pom("mock-user-service/pom.xml")
          PY

      - name: Extract versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          def package_version(path: str) -> str:
            return json.loads(Path(path).read_text(encoding="utf-8"))["version"]

          def pom_version(path: str) -> str:
            text = Path(path).read_text(encoding="utf-8")
            parent = re.search(r"<parent>.*?</parent>", text, flags=re.S)
            start = parent.end() if parent else 0
            match = re.search(r"<version>\s*([^<]+)\s*</version>", text[start:])
            if match is None:
              raise RuntimeError(f"Missing version in {path}")
            return match.group(1)

          print(f"frontend={package_version('mock-control-center/package.json')}")
          print(f"orchestrator={package_version('orchestrator/package.json')}")
          print(f"worker={package_version('worker-service/package.json')}")
          print(f"mockuser={pom_version('mock-user-service/pom.xml')}")
          PY

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mock-control-center
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: mock-control-center
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mock-control-center:${{ steps.versions.outputs.frontend }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mock-control-center:latest

      - name: Build and push mock-orchestrator
        if: needs.detect-changes.outputs.orchestrator == 'true'
        uses: docker/build-push-action@v6
        with:
          context: orchestrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mock-orchestrator:${{ steps.versions.outputs.orchestrator }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mock-orchestrator:latest

      - name: Build and push mock-worker-service
        if: needs.detect-changes.outputs.worker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: worker-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mock-worker-service:${{ steps.versions.outputs.worker }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mock-worker-service:latest

      - name: Build and push mock-user-service
        if: needs.detect-changes.outputs.mockuser == 'true'
        uses: docker/build-push-action@v6
        with:
          context: mock-user-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mock-user-service:${{ steps.versions.outputs.mockuser }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mock-user-service:latest

      - name: Commit version bumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mock-control-center/package.json orchestrator/package.json worker-service/package.json mock-user-service/pom.xml
          if git diff --staged --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git commit -m "chore(version): bump changed mock services [skip ci]"
          git push
